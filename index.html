<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/react.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenwall</title>
    <script>
      // Applies the theme stored by `src/settingsStorage.ts` before the first paint, so the page doesn't
      // flash the system theme while the app loads.
      try {
        // The stylesheet matches only the light and dark themes, so any other value follows the system.
        const theme = localStorage.getItem("theme");
        if (theme !== null) document.documentElement.dataset.theme = theme;
      } catch {
        // Unreadable storage keeps the system theme.
      }
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
