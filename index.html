<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/react.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenwall</title>
    <script>
      // Applies the stored theme before the first paint, so the page doesn't flash the system theme
      // while the app loads. The app applies it again through `src/settingsStorage.ts`.
      try {
        const settings = JSON.parse(localStorage.getItem("settings"));
        if (
          settings.version === 1 &&
          ["light", "dark"].includes(settings.theme)
        ) {
          document.documentElement.dataset.dark = String(
            settings.theme === "dark",
          );
        }
      } catch {
        // Missing or unreadable settings keep the system theme.
      }
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
